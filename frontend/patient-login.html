
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">

    <title>Patient Login | LifeLine Navigator</title>

    <link rel="stylesheet" href="/auth.css">
</head>
<body>
    <main class="login-container patient-theme">

        <div class="login-brand">
            <div class="brand-icon">✚</div>
            <h1>LifeLine <span>Navigator</span></h1>
            <p>Hospital Management System</p>
        </div>

        <section class="login-card">

            <div class="login-heading">
                <span class="portal-tag">USER PORTAL</span>
                <h2>Welcome, User</h2>
                <p>Sign in to access your user account.</p>
            </div>

            <form id="patientLoginForm">

                <div class="form-group">
                    <label for="patientUsername">Username</label>
                    <input
                        type="text"
                        id="patientUsername"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="patientPassword">Password</label>
                    <input
                        type="password"
                        id="patientPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Sign In →
                </button>
                <a href="/" class="back-link">← RETURN</a>
            </form>

            <p class="login-footer">
                Your health information, all in one place.
            </p>

        </section>

    </main>

    <script src="/auth.js"></script>
</body>
</html>
